<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F7928" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#F5DE8B" />
      <stop offset="100%" stop-color="#B38F20" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="60" fill="#0B0B0B" />
  <circle cx="200" cy="200" r="170" fill="url(#goldGlow)" />
  
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
  
  <polygon points="200,30 206,45 200,60 194,45" fill="url(#goldGrad)" />
  <polygon points="200,340 206,355 200,370 194,355" fill="url(#goldGrad)" />
  <polygon points="30,200 45,206 60,200 45,194" fill="url(#goldGrad)" />
  <polygon points="340,200 355,206 370,200 355,194" fill="url(#goldGrad)" />

  <circle cx="200" cy="200" r="110" fill="#141414" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4 3" />

  <text x="200" y="225" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="100" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">RK</text>
  <text x="200" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAF7F0" text-anchor="middle" letter-spacing="8" opacity="0.85">ROKEA</text>
</svg>